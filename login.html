<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a class="profile-link" href="login.html">
                    <img src="profile.svg" alt="Profile">
                </a>
            </nav>
        </header>

        <main>
            <section class="form-card login-card">
                <h2>Welcome to PostIt</h2>

                <p>
                    <a href="#">Create an account</a>
                </p>

                <p>or</p>
                <p>Please log in</p>

                <form action="index.html">
                    <label>
                        Email
                        <input
                            type="email"
                            name="email"
                            placeholder="Email"
                            required
                        >
                    </label>

                    <label>
                        Password
                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >
                    </label>

                    <button type="submit">Log in</button>
                </form>

                <p>
                    <a href="#">Forget password</a>
                </p>
            </section>
        </main>
    </div>
</body>
</html>
